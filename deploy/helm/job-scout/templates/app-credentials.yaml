{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret }}
  labels:
    {{- include "job-scout.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  API_TOKEN_SEED: {{ .Values.secrets.apiTokenSeed | quote }}
  AUTH_PASSWORD: {{ .Values.secrets.authPassword | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- range $k, $v := .Values.secrets.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
