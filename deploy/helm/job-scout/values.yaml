# Generic chart values. Keep real hostnames, registries and credentials in private overrides; see docs/DEPLOY.md.
image:
  # Your private registry path, e.g. registry.example.com/job-scout
  repository: job-scout
  tag: "2.14.5"
  pullPolicy: IfNotPresent

nameOverride: job-scout
fullnameOverride: ""

imagePullSecrets: []

api:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 768Mi }

worker:
  replicas: 1
  # false: the CronJobs below enqueue discovery/watch/retention (WORKER_SCHEDULER=0)
  inProcessScheduler: false
  nodeOptions: "--max-old-space-size=384"
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# Each runs `once.ts <task>` with the app image; tasks: discovery, watch (also the stale-triage sweep), retention, stale-triage.
# Every container (api, worker, cron) applies pending migrations at startup.
cronJobs:
  discovery:
    enabled: true
    schedule: "*/30 * * * *"
    task: discovery
  watch:
    enabled: true
    schedule: "15 */2 * * *"
    task: watch
  retention:
    enabled: true
    schedule: "30 3 * * *"
    task: retention
cronDefaults:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 300m, memory: 384Mi }

service:
  port: 8080

metrics:
  enabled: true
  port: 9464
  scrapeInterval: 30s
  job: job-scout

# Grafana dashboard ConfigMap (label grafana_dashboard: "1")
dashboard:
  enabled: false
  folder: job-scout

# Non-secret environment, rendered into a ConfigMap. Variables are documented in .env.example.
env:
  AUTH_MODE: token
  PUBLIC_BASE_URL: http://localhost:8080
  HOST: 0.0.0.0
  PORT: "8080"
  WORKER_CONCURRENCY: "2"
  WORKER_POLL_MS: "1500"
  ATS_USER_AGENT: job-scout/2 (local; no apply)
  LLM_TIMEOUT_MS: "180000"
  PG_POOL_MAX: "6"
  LOG_FORMAT: json
  LOG_LEVEL: info
  OPENAI_BASE_URL: ""
  STEEL_BASE_URL: ""
  BROWSER_MCP_URL: ""
  WAHA_BASE_URL: ""
  WAHA_SESSION: default

# Secret with DATABASE_URL, AUTH_PASSWORD and/or API_TOKEN_SEED, OPENAI_API_KEY and optional integration keys.
existingSecret: job-scout-secrets
# Further Secrets mounted with optional: true
extraSecrets: []
# Test/local only: renders existingSecret from these values. Never commit real credentials.
secrets:
  create: false
  databaseUrl: ""
  apiTokenSeed: ""
  authPassword: ""
  openaiApiKey: ""
  extra: {}

httpRoute:
  enabled: false
  hostnames: []
  parentRefs: []

nodeSelector: {}
affinity: {}
tolerations: []
